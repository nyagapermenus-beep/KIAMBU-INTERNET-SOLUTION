<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Kiambu Internet Solutions - Network Monitor</title>
    <script src="https://google.com" async defer></script>
    <style>
        :root { --navy: #1b365d; --navy-dark: #0f213c; --cyan: #00d2ff; --danger: #d93025; --success: #188038; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body.login-body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--navy-dark); overflow: hidden; position: relative; }
        .bg-video, #network-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
        .video-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11, 25, 48, 0.72); z-index: 1; }
        .login-card { position: relative; z-index: 2; width: 92%; max-width: 440px; background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(10px); border-radius: 10px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .card-header-navy { background: var(--navy); color: #fff; padding: 18px 20px; text-align: center; font-size: 1.15rem; font-weight: 700; }
        .login-form-wrap { padding: 28px 32px; }
        .login-form-wrap h2 { text-align: center; color: var(--navy); margin-bottom: 20px; font-size: 1.25rem; }
        .form-group { margin-bottom: 15px; }
        .form-group input { width: 100%; padding: 12px 14px; border: 1.5px solid #444; border-radius: 5px; font-size: 0.95rem; }
        .btn-primary { width: 100%; padding: 12px; background: var(--navy); color: #fff; border: none; border-radius: 5px; font-size: 1rem; font-weight: 600; cursor: pointer; }
        .btn-primary:hover { background: #132744; }
        .divider { display: flex; align-items: center; text-align: center; margin: 18px 0; color: #666; font-size: 0.85rem; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #ccc; }
        .divider:not(:empty)::before { margin-right: .75em; }
        .divider:not(:empty)::after { margin-left: .75em; }
        .google-btn-wrap { display: flex; justify-content: center; margin-bottom: 14px; }
        .auth-links { text-align: center; font-size: 0.88rem; color: #555; margin-top: 12px; }
        .auth-links a { color: var(--navy); font-weight: 600; text-decoration: none; }
        .alert-error { background: #fdecea; color: var(--danger); padding: 10px; border-radius: 5px; margin-bottom: 14px; font-size: 0.9rem; border: 1px solid #f5c6cb; display: none; }
        .alert-success { background: #e6f4ea; color: var(--success); padding: 10px; border-radius: 5px; margin-bottom: 14px; font-size: 0.9rem; border: 1px solid #ceead6; display: none; }
    </style>
</head>
<body class="login-body">

    <video autoplay muted loop playsinline poster="login-bg.png" class="bg-video">
        <source src="network-bg.mp4" type="video/mp4">
    </video>
    <canvas id="network-canvas"></canvas>
    <div class="video-overlay"></div>

    <div class="login-card">
        <div class="card-header-navy">Kiambu Internet Solutions - Network Monitor</div>
        <div class="login-form-wrap">
            <h2>Technician / Management Login</h2>

            <div id="login-error" class="alert-error"></div>
            <div id="login-success" class="alert-success">Account created! You can now log in.</div>

            <form id="login-form">
                <div class="form-group">
                    <input type="text" id="username" placeholder="Username" required>
                </div>
                <div class="form-group">
                    <input type="password" id="password" placeholder="Password" required>
                </div>
                <button type="submit" class="btn-primary">Login</button>
            </form>

            <div class="divider">OR</div>

            
            <div class="google-btn-wrap">
                <div id="google-btn-container"></div>
            </div>

            <div class="auth-links">
                Don't have an account? <a href="register.html">Sign Up</a><br><br>
                <span style="color:#777; font-size:0.82rem;">Forgot password? Contact system administrator</span>
            </div>
        </div>
    </div>

    <script>
        const GOOGLE_CLIENT_ID = "284696192427-13r9t03pub6ggllt3r2moet4ce7ra0m8.apps.googleusercontent.com";

        // Animated Background
        const canvas = document.getElementById('network-canvas');
        const ctx = canvas.getContext('2d');
        let width, height, particles;
        function initCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            particles = Array.from({ length: 65 }, () => ({
                x: Math.random() * width, y: Math.random() * height,
                vx: (Math.random() - 0.5) * 0.6, vy: (Math.random() - 0.5) * 0.6,
                r: Math.random() * 2 + 1.5
            }));
        }
        function drawCanvas() {
            ctx.clearRect(0, 0, width, height);
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                p.x += p.vx; p.y += p.vy;
                if (p.x < 0 || p.x > width) p.vx *= -1;
                if (p.y < 0 || p.y > height) p.vy *= -1;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = '#00d2ff'; ctx.fill();
                for (let j = i + 1; j < particles.length; j++) {
                    const p2 = particles[j];
                    const dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                    if (dist < 140) {
                        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p2.x, p2.y);
                        ctx.strokeStyle = `rgba(0, 210, 255, ${1 - dist / 140})`;
                        ctx.lineWidth = 0.7; ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(drawCanvas);
        }
        window.addEventListener('resize', initCanvas);
        initCanvas(); drawCanvas();

        // Check active session
        if (localStorage.getItem('kis_current_user')) {
            window.location.href = 'dashboard.html';
        }
        if (new URLSearchParams(window.location.search).get('registered')) {
            document.getElementById('login-success').style.display = 'block';
        }

        // Standard Account Login
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const input = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;
            const users = JSON.parse(localStorage.getItem('kis_users') || '[]');
            const user = users.find(u => (u.username === input || u.email === input) && u.password === pass);

            if (user) {
                localStorage.setItem('kis_current_user', JSON.stringify(user));
                window.location.href = 'dashboard.html';
            } else {
                const err = document.getElementById('login-error');
                err.textContent = 'Invalid username or password. Please sign up or continue with Google.';
                err.style.display = 'block';
            }
        });

        // Google OAuth Token Handler
        function handleGoogleCredentialResponse(response) {
            try {
                const parts = response.credential.split('.');
                const base64 = parts[1].replace(/-/g, '+').replace(/_/g, '/');
                const payload = JSON.parse(decodeURIComponent(atob(base64).split('').map(c =>
                    '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
                ).join('')));

                const users = JSON.parse(localStorage.getItem('kis_users') || '[]');
                let existing = users.find(u => u.email === payload.email);

                if (!existing) {
                    existing = {
                        username: payload.name || payload.email.split('@')[0],
                        email: payload.email,
                        password: null,
                        role: 'Technician',
                        googleId: payload.sub
                    };
                    users.push(existing);
                    localStorage.setItem('kis_users', JSON.stringify(users));
                }

                localStorage.setItem('kis_current_user', JSON.stringify(existing));
                window.location.href = 'dashboard.html';
            } catch (err) {
                const errBox = document.getElementById('login-error');
                errBox.textContent = 'Google Sign-In error: ' + err.message;
                errBox.style.display = 'block';
            }
        }

        // Initialize Real Google Sign-In Button
        window.onload = function() {
            if (window.google) {
                google.accounts.id.initialize({
                    client_id: GOOGLE_CLIENT_ID,
                    callback: handleGoogleCredentialResponse
                });
                google.accounts.id.renderButton(
                    document.getElementById("google-btn-container"),
                    { theme: "outline", size: "large", width: 376, text: "continue_with" }
                );
            }
        };
    </script>
</body>
</html>

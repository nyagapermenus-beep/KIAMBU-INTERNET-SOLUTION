<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetPulse - Kiambu Internet Solutions</title>
    <!-- Complete raw framework stylesheet to bypass all external CDN blocking -->
    <style>
        * { box-sizing: border-box; }
        body { background-color: #020617; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; min-height: 100vh; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow-x: hidden; }
        .card { background-color: #0f172a; border: 1px solid #1e293b; padding: 2.5rem 2rem; border-radius: 1rem; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
        .logo-box { width: 4rem; height: 4rem; background: rgba(6,182,212,0.1); border: 1px solid rgba(6,182,212,0.2); color: #22d3ee; border-radius: 1rem; margin: 0 auto 1.5rem auto; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: bold; }
        h1 { font-size: 1.75rem; font-weight: bold; margin: 0; tracking: -0.025em; }
        p { font-size: 0.85rem; color: #94a3b8; margin: 0.5rem 0 2rem 0; }
        .btn { width: 100%; padding: 0.85rem; background: #ffffff; color: #0f172a; font-weight: bold; border-radius: 0.75rem; border: 1px solid #e2e8f0; cursor: pointer; font-size: 0.85rem; transition: background 0.2s, transform 0.1s; display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
        .btn:hover { background: #f1f5f9; transform: translateY(-1px); }
        .btn:active { transform: translateY(0); }
        .hidden { display: none !important; }
        
        /* Main Dashboard Core Layout */
        .app-container { display: flex; width: 100vw; min-height: 100vh; flex-direction: row; background: #020617; position: absolute; top: 0; left: 0; }
        aside { width: 16rem; background: #0f172a; border-right: 1px solid #1e293b; padding: 1.5rem; display: flex; flex-direction: column; justify-content: space-between; }
        main { flex: 1; display: flex; flex-direction: column; background: #020617; }
        header { padding: 1.25rem 2rem; background: rgba(15,23,42,0.6); border-bottom: 1px solid #1e293b; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; }
        .content-box { padding: 2rem; gap: 2rem; display: flex; flex-direction: column; width: 100%; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; }
        .stat-card { background: #0f172a; border: 1px solid #1e293b; padding: 1.5rem; border-radius: 1rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .stat-label { font-size: 0.75rem; color: #94a3b8; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
        .stat-val { font-size: 1.85rem; font-weight: 800; margin-top: 0.5rem; }
        .nav-btn { width: 100%; text-align: left; padding: 0.85rem 1rem; background: transparent; color: #94a3b8; border: none; border-radius: 0.75rem; cursor: pointer; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.5rem; transition: all 0.2s; }
        .nav-btn:hover { background: rgba(255,255,255,0.05); color: #fff; }
        .nav-btn.active { background: rgba(6,182,212,0.1); color: #22d3ee; border: 1px solid rgba(6,182,212,0.15); }
        .logout-btn { width: 100%; padding: 0.75rem; background: rgba(239,68,68,0.1); color: #f87171; border: 1px solid rgba(239,68,68,0.2); border-radius: 0.75rem; cursor: pointer; font-size: 0.85rem; font-weight: 600; transition: background 0.2s; }
        .logout-btn:hover { background: rgba(239,68,68,0.2); }
        
        /* Form Styling */
        .form-group { display: flex; flex-direction: column; gap: 0.5rem; }
        .form-grid { display: grid; grid-template-columns: 2fr 2fr 1fr; gap: 1rem; align-items: flex-end; }
        .input-field { padding: 0.75rem 1rem; background: #020617; border: 1px solid #1e293b; color: #fff; border-radius: 0.75rem; font-size: 0.85rem; width: 100%; transition: border-color 0.2s; }
        .input-field:focus { outline: none; border-color: #22d3ee; }
        .submit-btn { padding: 0.75rem 1.5rem; background: #22d3ee; color: #0f172a; font-weight: bold; border: none; border-radius: 0.75rem; cursor: pointer; font-size: 0.85rem; transition: background 0.2s; height: 100%; }
        .submit-btn:hover { background: #67e8f9; }
    </style>

</head>

                <div>
                    <h2 style="font-size: 1.35rem; font-weight: 800; margin: 0 0 2rem 0; color: #22d3ee; tracking: -0.025em;">NetPulse</h2>
                    <button onclick="switchTab('dashboard')" id="nav-dashboard" class="nav-btn active">Dashboard</button>

                <header>

                    <span id="userGreeting" style="color: #38bdf8; font-weight: 600;">Session Status</span>
                </header>

                        <div class="grid-3">
                            <div class="stat-card">

                            </div>

                                <div class="stat-label">Downtime Alerts</div>
                                <div class="stat-val" style="color: #f87171;">0 Active</div>
                            </div>
                        </div>
                        <div class="stat-card" style="margin-top: 1.75rem; height: 350px; position: relative;">
                            <canvas id="trafficChart"></canvas>
                        </div>
                    </div>

                    <div id="tab-devices" class="hidden">
                        <div class="stat-card">
                            <h3 style="margin: 0 0 1.25rem 0; font-size: 1rem; font-weight: bold; color: #e2e8f0;">Add New Hardware Node</h3>
                            <form onsubmit="addDevice(event)" class="form-grid">
                                <div class="form-group">
                                    <label style="font-size: 0.7rem; color: #94a3b8; font-weight: 700; text-transform: uppercase;">Device Name</label>
                                    <input type="text" id="deviceName" placeholder="e.g. Core Switch" fraternal required class="input-field">
                                </div>
                                <div class="form-group">
                                    <label style="font-size: 0.7rem; color: #94a3b8; font-weight: 700; text-transform: uppercase;">IP Address</label>
                                    <input type="text" id="deviceIP" placeholder="e.g. 192.168.10.1" required class="input-field">
                                </div>
                                <button type="submit" class="submit-btn">Save to DB</button>
                            </form>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

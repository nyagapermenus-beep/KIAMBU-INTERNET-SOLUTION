<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Kiambu Internet Solutions - Network Monitor</title>
    <script src="https://google.com" async defer></script>
    <style>
        :root {
            --navy: #1b365d;
            --navy-dark: #0f213c;
            --cyan: #00d2ff;
            --danger: #d93025;
            --success: #188038;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body.login-body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--navy-dark);
            overflow: hidden;
            position: relative;
        }
        .bg-video, #network-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 0;
        }
        .video-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(11, 25, 48, 0.72);
            z-index: 1;
        }
        .login-card {
            position: relative;
            z-index: 2;
            width: 92%;
            max-width: 440px;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .card-header-navy {
            background: var(--navy);
            color: #fff;
            padding: 18px 20px;
            text-align: center;
            font-size: 1.15rem;
            font-weight: 700;
        }
        .login-form-wrap { padding: 28px 32px; }
        .login-form-wrap h2 { text-align: center; color: var(--navy); margin-bottom: 20px; font-size: 1.25rem; }
        .form-group { margin-bottom: 15px; }
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #444;
            border-radius: 5px;
            font-size: 0.95rem;
        }
        .btn-primary {
            width: 100%;
            padding: 12px;
            background: var(--navy);
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-primary:hover { background: #132744; }
        .divider {
            display: flex; align-items: center; text-align: center;
            margin: 18px 0; color: #666; font-size: 0.85rem;
        }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #ccc; }
        .divider:not(:empty)::before { margin-right: .75em; }
        .divider:not(:empty)::after { margin-left: .75em; }
        .google-btn-wrap { display: flex; justify-content: center; margin-bottom: 14px; }
        .btn-google {
            width: 100%;
            padding: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #fff;
            border: 1.5px solid var(--navy);
            color: var(--navy);
            border-radius: 5px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-google:hover { background: #f0f4f9; }
        .auth-links { text-align: center; font-size: 0.88rem; color: #555; margin-top: 12px; }
        .auth-links a { color: var(--navy); font-weight: 600; text-decoration: none; }
        .alert-error { background: #fdecea; color: var(--danger); padding: 10px; border-radius: 5px; margin-bottom: 14px; font-size: 0.9rem; border: 1px solid #f5c6cb; display: none; }
        .alert-success { background: #e6f4ea; color: var(--success); padding: 10px; border-radius: 5px; margin-bottom: 14px; font-size: 0.9rem; border: 1px solid #ceead6; display: none; }
    </style>
</head>

    <script src="app.js"></script>
    <script>
        // Built-in Live Network Canvas Animation
        const canvas = document.getElementById('network-canvas');
        const ctx = canvas.getContext('2d');
        let width, height, particles;
        function initCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            particles = Array.from({ length: 65 }, () => ({
                x: Math.random() * width, y: Math.random() * height,
                vx: (Math.random() - 0.5) * 0.6, vy: (Math.random() - 0.5) * 0.6,
                r: Math.random() * 2 + 1.5
            }));
        }
        function drawCanvas() {
            ctx.clearRect(0, 0, width, height);
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                p.x += p.vx; p.y += p.vy;
                if (p.x < 0 || p.x > width) p.vx *= -1;
                if (p.y < 0 || p.y > height) p.vy *= -1;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = '#00d2ff'; ctx.fill();
                for (let j = i + 1; j < particles.length; j++) {
                    const p2 = particles[j];
                    const dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                    if (dist < 140) {
                        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p2.x, p2.y);
                        ctx.strokeStyle = `rgba(0, 210, 255, ${1 - dist / 140})`;
                        ctx.lineWidth = 0.7; ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(drawCanvas);
        }
        window.addEventListener('resize', initCanvas);
        initCanvas(); drawCanvas();

        // Auth Logic
        if (typeof getCurrentUser === 'function' && getCurrentUser()) {
            window.location.href = 'dashboard.html';
        }
        if (new URLSearchParams(window.location.search).get('registered')) {
            document.getElementById('login-success').style.display = 'block';
        }

        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const input = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;
            const users = typeof getUsers === 'function' ? getUsers() : [{ username: 'admin', email: 'admin@kiambuinetsolutions.co.ke', password: 'password123', role: 'Management' }];
            const user = users.find(u => (u.username === input || u.email === input) && u.password === pass);

            if (user) {
                localStorage.setItem('kis_current_user', JSON.stringify(user));
                window.location.href = 'dashboard.html';
            } else {
                const err = document.getElementById('login-error');
                err.textContent = 'Invalid username or password. Try admin / password123.';
                err.style.display = 'block';
            }
        });

        window.onload = function() {

                    callback: handleGoogleCredentialResponse
                });

                    document.getElementById("google-btn-container"),
                    { theme: "outline", size: "large", width: 376, text: "continue_with" }
                );
            } else {
                document.getElementById("google-btn-container").innerHTML =
                    `<button type="button" onclick="demoGoogleLogin()" class="btn-google">

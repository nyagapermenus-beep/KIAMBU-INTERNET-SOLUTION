<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Kiambu Internet Solutions - Network Monitor</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://google.com" async defer></script>
</head>
<body class="login-body">

    <video autoplay muted loop playsinline poster="login-bg.png" class="bg-video">
        <source src="network-bg.mp4" type="video/mp4">
    </video>
    <canvas id="network-canvas"></canvas>
    <div class="video-overlay"></div>

    <div class="login-card">
        <div class="card-header-navy">Kiambu Internet Solutions - Network Monitor</div>
        <div class="login-form-wrap">
            <h2>Technician / Management Login</h2>

            <div id="login-error" class="alert-error"></div>
            <div id="login-success" class="alert-success">Account created! You can now log in.</div>

            <form id="login-form">
                <div class="form-group">
                    <input type="text" id="username" placeholder="Username or Email (Demo: admin)" required>
                </div>
                <div class="form-group">
                    <input type="password" id="password" placeholder="Password (Demo: password123)" required>
                </div>
                <button type="submit" class="btn-primary">Login</button>
            </form>

            <div class="divider">OR</div>

            <div class="google-btn-wrap">
                <div id="google-btn-container" style="width:100%;"></div>
            </div>

            <div class="auth-links">
                Don't have an account? <a href="register.html">Sign Up</a><br><br>
                <span style="color:#777; font-size:0.82rem;">Forgot password? Contact system administrator</span>
            </div>
        </div>
    </div>

    <script src="network-bg.js"></script>
    <script src="app.js"></script>
    <script>
        if (getCurrentUser()) window.location.href = 'dashboard.html';
        if (new URLSearchParams(window.location.search).get('registered')) {
            document.getElementById('login-success').style.display = 'block';
        }

        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const input = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;
            const user = getUsers().find(u => (u.username === input || u.email === input) && u.password === pass);

            if (user) {
                localStorage.setItem('kis_current_user', JSON.stringify(user));
                window.location.href = 'dashboard.html';
            } else {
                const err = document.getElementById('login-error');
                err.textContent = 'Invalid username or password. Try admin / password123.';
                err.style.display = 'block';
            }
        });

        window.onload = function() {
            if (window.google && GOOGLE_CLIENT_ID !== "YOUR_GOOGLE_CLIENT_://googleusercontent.com") {
                google.accounts.id.initialize({
                    client_id: GOOGLE_CLIENT_ID,
                    callback: handleGoogleCredentialResponse
                });
                google.accounts.id.renderButton(
                    document.getElementById("google-btn-container"),
                    { theme: "outline", size: "large", width: 320, text: "continue_with" }
                );
            } else {
                document.getElementById("google-btn-container").innerHTML =
                    `<button type="button" onclick="demoGoogleLogin()" class="btn-sm btn-outline" style="width:100%; padding:11px; display:flex; align-items:center; justify-content:center; gap:10px; background:#fff;">
                        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
                        Continue with Google
                    </button>`;
            }
        };

        function demoGoogleLogin() {
            const email = prompt("Enter your Google email to simulate Google Sign-In:", "technician@gmail.com");
            if (!email) return;
            const users = getUsers();
            let user = users.find(u => u.email === email);
            if (!user) {
                user = { username: email.split('@'), email: email, password: null, role: 'Technician' };
                users.push(user);
                saveUsers(users);
            }
            localStorage.setItem('kis_current_user', JSON.stringify(user));
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>

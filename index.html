<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetPulse - Kiambu Internet Solutions</title>
    <!-- Core layout stylesheet failsafe backup styles -->
    <style>
        body { background-color: #020617; color: #f8fafc; font-family: sans-serif; min-height: 100vh; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .card { background-color: #0f172a; border: 1px solid #1e293b; padding: 2rem; border-radius: 1rem; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); }
        .logo-box { width: 4rem; height: 4rem; background: rgba(6,182,212,0.1); border: 1px solid rgba(6,182,212,0.2); color: #22d3ee; border-radius: 1rem; margin-bottom: 1rem; display: inline-flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: bold; }
        h1 { font-size: 1.5rem; font-weight: bold; margin: 0; }
        p { font-size: 0.75rem; color: #22d3ee; margin: 0.25rem 0 1.5rem 0; }
        .btn { width: 100%; padding: 0.75rem; background: #ffffff; color: #0f172a; font-weight: bold; border-radius: 0.75rem; border: 1px solid #e2e8f0; cursor: pointer; font-size: 0.75rem; transition: background 0.2s; }
        .btn:hover { background: #f1f5f9; }
        .hidden { display: none !important; }
        .app-container { display: flex; width: 100vw; min-height: 100vh; flex-direction: row; background: #020617; }
        aside { width: 16rem; background: #0f172a; border-right: 1px solid #1e293b; padding: 1.5rem; display: flex; flex-direction: column; justify-content: space-between; }
        main { flex: 1; display: flex; flex-direction: column; }
        header { padding: 1rem 1.5rem; background: rgba(15,23,42,0.5); border-bottom: 1px solid #1e293b; display: flex; justify-content: space-between; font-size: 0.75rem; }
        .content-box { padding: 1.5rem; gap: 1.5rem; display: flex; flex-direction: column; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
        .stat-card { background: #0f172a; border: 1px solid #1e293b; padding: 1.25rem; border-radius: 1rem; }
        .stat-val { font-size: 1.5rem; font-weight: bold; margin-top: 0.25rem; }
        .nav-btn { width: 100%; text-align: left; padding: 0.75rem 1rem; background: transparent; color: #94a3b8; border: none; border-radius: 0.75rem; cursor: pointer; font-size: 0.75rem; font-weight: 600; margin-bottom: 0.25rem; }
        .nav-btn.active { background: rgba(6,182,212,0.1); color: #22d3ee; }
        .logout-btn { width: 100%; padding: 0.5rem; background: rgba(239,68,68,0.1); color: #f87171; border: 1px solid rgba(239,68,68,0.2); border-radius: 0.75rem; cursor: pointer; font-size: 0.75rem; }
    </style>
    <script src="https://tailwindcss.com"></script>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <!-- LOGIN VIEW -->
    <div id="loginSection" class="w-full min-h-screen flex items-center justify-center p-4">
        <div class="card">
            <div class="logo-box">NP</div>
            <h1>NetPulse</h1>
            <p>Kiambu Internet Solutions &bull; Traffic Monitor</p>

            <button id="google-login-btn" class="btn">
                Sign in with Google Account
            </button>
        </div>
    </div>

    <!-- MAIN APP VIEW (Hidden until login complete) -->
    <div id="appSection" class="hidden w-full min-h-screen flex flex-col md:flex-row">
        <div class="app-container">
            <aside>
                <div>
                    <h2 style="font-size: 1.25rem; margin: 0 0 1.5rem 0; color: #22d3ee;">NetPulse</h2>
                    <button onclick="switchTab('dashboard')" id="nav-dashboard" class="nav-btn active">Dashboard</button>
                    <button onclick="switchTab('devices')" id="nav-devices" class="nav-btn">Device Management</button>
                </div>
                <div>
                    <button onclick="handleLogout()" class="logout-btn">Logout</button>
                </div>
            </aside>

            <main>
                <header>
                    <span style="font-weight: bold; color: #cbd5e1;">Kiambu Internet Solutions &bull; Live Monitor</span>
                    <span id="userGreeting" style="color: #64748b;">Session Status</span>
                </header>

                <div class="content-box">
                    <div id="tab-dashboard">
                        <div class="grid-3">
                            <div class="stat-card">
                                <div style="font-size: 0.75rem; color: #94a3b8; font-weight: 600;">Bandwidth Throughput</div>
                                <div class="stat-val" style="color: #22d3ee;">84.5 Mbps</div>
                            </div>
                            <div class="stat-card">
                                <div style="font-size: 0.75rem; color: #94a3b8; font-weight: 600;">Active Devices</div>
                                <div class="stat-val" style="color: #34d399;">3 Online</div>
                            </div>
                            <div class="stat-card">
                                <div style="font-size: 0.75rem; color: #94a3b8; font-weight: 600;">Downtime Alerts</div>
                                <div class="stat-val" style="color: #f87171;">0 Active</div>
                            </div>
                        </div>
                        <div class="stat-card" style="margin-top: 1.5rem; height: 300px; position: relative;">
                            <canvas id="trafficChart"></canvas>
                        </div>
                    </div>

                    <div id="tab-devices" class="hidden">
                        <div class="stat-card">
                            <h3 style="margin: 0 0 1rem 0; font-size: 0.875rem;">Add New Device</h3>
                            <form onsubmit="addDevice(event)" style="display: flex; gap: 1rem;">
                                <input type="text" id="deviceName" placeholder="Device Name" required style="padding: 0.5rem; background: #020617; border: 1px solid #1e293b; color: #fff; border-radius: 0.5rem; flex: 1;">
                                <input type="text" id="deviceIP" placeholder="IP Address" required style="padding: 0.5rem; background: #020617; border: 1px solid #1e293b; color: #fff; border-radius: 0.5rem; flex: 1;">
                                <button type="submit" style="padding: 0.5rem 1rem; background: #22d3ee; color: #0f172a; font-weight: bold; border: none; border-radius: 0.5rem; cursor: pointer;">Save</button>
                            </form>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- APPLICATION SCRIPTS & CORE AUTH LOGIC -->
    <script>
        const SUPABASE_URL = "https://supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_vkyC-YI4SmysOfEe0SAS9w_4faEfwoy";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const loginButton = document.getElementById('google-login-btn');

        if (loginButton) {
            loginButton.addEventListener('click', async () => {
                await _supabase.auth.signInWithOAuth({
                    provider: 'google',
                    options: {
                        redirectTo: window.location.origin
                    }
                });
            });
        }

        _supabase.auth.onAuthStateChange((event, session) => {
            if (session && session.user) {
                document.body.style.justifyContent = "flex-start";
                document.body.style.alignItems = "stretch";
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('appSection').classList.remove('hidden');
                document.getElementById('userGreeting').innerText = `User: ${session.user.email}`;
                initChart();
            } else {
                document.body.style.justifyContent = "center";
                document.body.style.alignItems = "center";
                document.getElementById('loginSection').classList.remove('hidden');
                document.getElementById('appSection').classList.add('hidden');
            }
        });

        async function handleLogout() {
            await _supabase.auth.signOut();
        }

        function switchTab(tabId) {
            document.getElementById('tab-dashboard').classList.add('hidden');
            document.getElementById('tab-devices').classList.add('hidden');
            document.getElementById(`tab-${tabId}`).classList.remove('hidden');
            document.getElementById('nav-dashboard').classList.remove('active');
            document.getElementById('nav-devices').classList.remove('active');
            document.getElementById(`nav-${tabId}`).幕.add('active');
        }

        function addDevice(e) {
            e.preventDefault();
            alert("Device registered successfully!");
        }

        function initChart() {
            const ctx = document.getElementById('trafficChart');
            if (ctx && !window.myTrafficChart) {
                window.myTrafficChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: ['00:00', '04:00', '08:00', '12:00', '16:00', '20:00'],
                        datasets: [{
                            label: 'Throughput (Mbps)',
                            data: [30, 15, 75, 84.5, 60, 45],
                            borderColor: '#22d3ee',
                            backgroundColor: 'rgba(34,211,238,0.1)',
                            fill: true,
                            tension: 0.4
                        }]
                    },

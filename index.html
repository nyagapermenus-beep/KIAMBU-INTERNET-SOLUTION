<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Kiambu Internet Solution</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 flex items-center justify-center min-h-screen">
    <div class="bg-slate-800 p-8 rounded-xl shadow-2xl w-full max-w-md border border-slate-700">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-sky-400">Kiambu Internet Solution</h1>
            <p id="form-subtitle" class="text-sm text-slate-400 mt-1">Please sign in to your account</p>
        </div>

        <!-- Feedback Alert -->
        <div id="alert-box" class="hidden mb-4 p-3 rounded text-sm text-center"></div>

        <!-- Form -->
        <form id="auth-form" onsubmit="handleAuth(event)">
            <div class="mb-4">
                <label class="block text-sm font-medium mb-1">Email Address</label>
                <input type="email" id="email" required class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded focus:outline-none focus:border-sky-500">
            </div>
            <div class="mb-6">
                <label class="block text-sm font-medium mb-1">Password</label>
                <input type="password" id="password" required class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded focus:outline-none focus:border-sky-500">
            </div>
            <button type="submit" id="submit-btn" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-semibold py-2 rounded transition duration-200">Login</button>
        </form>

        <!-- Toggle Mode -->
        <div class="mt-6 text-center text-sm text-slate-400">
            <span id="toggle-text">Don't have an account?</span>
            <button onclick="toggleMode()" id="toggle-btn" class="text-sky-400 hover:underline ml-1 font-medium">Sign up</button>
        </div>
    </div>

    <script>
        let isSignUp = false;

        function toggleMode() {
            isSignUp = !isSignUp;
            document.getElementById('form-subtitle').innerText = isSignUp ? 'Create a new account to get started' : 'Please sign in to your account';
            document.getElementById('submit-btn').innerText = isSignUp ? 'Sign Up' : 'Login';
            document.getElementById('toggle-text').innerText = isSignUp ? 'Already have an account?' : "Don't have an account?";
            document.getElementById('toggle-btn').innerText = isSignUp ? 'Login' : 'Sign up';
            document.getElementById('alert-box').classList.add('hidden');
        }

        function showAlert(message, type) {
            const box = document.getElementById('alert-box');
            box.innerText = message;
            box.className = `mb-4 p-3 rounded text-sm text-center ${type === 'error' ? 'bg-red-900/50 text-red-300 border border-red-700' : 'bg-green-900/50 text-green-300 border border-green-700'}`;
        }

        function handleAuth(event) {
            event.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            if (isSignUp) {
                // Register user
                if (localStorage.getItem('kis_user_' + email)) {
                    showAlert('Account already exists! Please login instead.', 'error');
                    return;
                }
                localStorage.setItem('kis_user_' + email, password);
                showAlert('Account created successfully! Please login.', 'success');
                toggleMode();
                document.getElementById('auth-form').reset();
            } else {
                // Login user
                const storedPassword = localStorage.getItem('kis_user_' + email);
                if (!storedPassword) {
                    showAlert('No account found with this email. Please sign up first!', 'error');
                    return;
                }
                if (storedPassword !== password) {
                    showAlert('Incorrect password. Please try again.', 'error');
                    return;
                }
                // Set session active & redirect
                localStorage.setItem('kis_logged_in', email);
                window.location.href = 'dashboard.html';
            }
        }
    </script>
</body>
</html>

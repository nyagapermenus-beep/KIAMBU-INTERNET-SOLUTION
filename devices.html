<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Device Management | Kiambu Internet Solutions</title>
  <style>
    :root {
      --bg-dark: #0a0e17;
      --panel-bg: rgba(16, 24, 40, 0.75);
      --accent-cyan: #00d2ff;
      --accent-purple: #9d4edd;
      --accent-green: #39ff14;
      --accent-red: #ff3333;
      --text-main: #f0f4f8;
      --text-muted: #8a99ad;
      --border-cyber: rgba(0, 210, 255, 0.15);
      --input-bg: rgba(10, 14, 23, 0.6);
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 100% 0%, rgba(157, 78, 221, 0.15) 0px, transparent 50%),
        radial-gradient(at 0% 100%, rgba(0, 210, 255, 0.15) 0px, transparent 50%),
        linear-gradient(rgba(18, 18, 18, 0.4) 1px, transparent 1px),
        linear-gradient(90deg, rgba(18, 18, 18, 0.4) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      color: var(--text-main);
    }

    .app-shell {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(10, 14, 23, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-cyber);
      padding: 15px 40px;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
    }

    .top-brand {
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--text-main);
      font-size: 18px;
    }

    .top-brand span {
      color: var(--accent-cyan);
      font-weight: 300;
    }

    .nav {
      display: flex;
      gap: 10px;
    }

    .nav a {
      color: var(--text-muted);
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.3s ease;
      border: 1px solid transparent;
    }

    .nav a:hover, .nav a.active {
      color: var(--accent-cyan);
      background: rgba(0, 210, 255, 0.08);
      border-color: rgba(0, 210, 255, 0.3);
      text-shadow: 0 0 8px rgba(0, 210, 255, 0.5);
    }

    .nav-user {
      font-size: 13px;
      color: var(--text-muted);
    }

    .logout {
      background: transparent;
      border: 1px solid var(--accent-red);
      color: var(--accent-red);
      padding: 5px 12px;
      border-radius: 4px;
      cursor: pointer;
      margin-left: 10px;
      transition: all 0.3s;
    }

    .logout:hover {
      background: rgba(255, 51, 51, 0.15);
      box-shadow: 0 0 10px rgba(255, 51, 51, 0.3);
    }

    .container {
      max-width: 1400px;
      width: 90%;
      margin: 30px auto;
      flex-grow: 1;
    }

    .page-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .page-heading h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
    }

    .page-heading p {
      margin: 5px 0 0 0;
      color: var(--text-muted);
      font-size: 14px;
    }

    .btn {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      border: none;
      color: #fff;
      padding: 10px 20px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(157, 78, 221, 0.4);
    }

    .topology-panel {
      background: var(--panel-bg);
      border: 1px solid var(--border-cyber);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 25px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .topology-panel h3 {
      margin-top: 0;
      margin-bottom: 15px;
      font-size: 15px;
      text-transform: uppercase;
      color: var(--accent-cyan);
    }

    #topologyMap {
      width: 100%;
      height: 250px;
      background: rgba(10, 14, 23, 0.8);
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.03);
    }

    .panel {
      background: var(--panel-bg);
      border: 1px solid var(--border-cyber);
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
    }

    .panel h3 {
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 16px;
      color: var(--accent-cyan);
      text-transform: uppercase;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field label {
      font-size: 12px;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .field input, .field select {
      background: var(--input-bg);
      border: 1px solid rgba(0, 210, 255, 0.25);
      border-radius: 6px;
      padding: 10px 14px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .form-actions {
      display: flex;
      gap: 12px;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 14px;
    }

    th {
      color: var(--text-muted);
      font-weight: 600;
      padding: 14px 10px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      text-transform: uppercase;
      font-size: 12px;
    }

    td {
      padding: 16px 10px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      color: var(--text-main);
    }

    .badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .badge.up { background: rgba(57, 255, 20, 0.15); color: var(--accent-green); }
    .badge.down { background: rgba(255, 51, 51, 0.15); color: var(--accent-red); }

    .action-btn-danger {
      background: transparent;
      border: 1px solid var(--accent-red);
      color: var(--accent-red);
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }

    .action-btn-danger:hover {
      background: rgba(255,51,51,0.15);
    }
  </style>
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <div class="top-brand">KIAMBU <span>INTERNET SOLUTIONS</span></div>
    <nav class="nav">
      <a class="" href="dashboard.html">Dashboard</a>
      <a class="active" href="devices.html">Device Management</a>
      <a class="" href="traffic-log.html">Traffic Logs</a>
      <a class="" href="reports.html">Reports</a>
    </nav>
    <div class="nav-user">User <button class="logout" onclick="logoutUser()">Logout</button></div>
  </header>

  <main class="container">
    <div class="page-heading">
      <div>
        <h1>Device Management</h1>
        <p>Add, update, view and remove monitored network devices.</p>
      </div>
      <button class="btn" onclick="openDeviceForm()">+ Add new device</button>
    </div>

    <div class="topology-panel">
      <h3>🕸️ Topology Node Map</h3>
      <canvas id="topologyMap"></canvas>
    </div>

    <div id="device-form-panel" class="panel" style="margin-bottom:20px; display:none;">
      <h3>Add or update device</h3>
      <form id="device-form" onsubmit="saveDeviceItem(event)">
        <div class="form-grid">
          <div class="field"><label>Device name</label><input id="device-name" required placeholder="e.g. Core Router"></div>
          <div class="field"><label>IP address</label><input id="device-ip" required placeholder="192.168.1.1"></div>
          <div class="field"><label>Device type</label><select id="device-type"><option>Router</option><option>Switch</option><option>Access Point</option><option>Server</option></select></div>
          <div class="field"><label>Status</label><select id="device-status"><option>Up</option><option>Down</option></select></div>
        </div>
        <div class="form-actions">
          <button class="btn" type="submit">Save device</button>
          <button class="btn" type="button" onclick="closeDeviceForm()" style="background: #333; box-shadow: none;">Cancel</button>
        </div>
      </form>
    </div>

    <div class="panel">
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Device name</th><th>IP address</th><th>Type</th><th>Status</th><th>Last polled</th><th>Actions</th></tr>
          </thead>
          <tbody id="device-rows"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script>
  let devices = JSON.parse(localStorage.getItem("network_devices")) || [
    { id: 1, name: "Core WAN Gateway", ip: "192.168.1.1", type: "Router", status: "Up", polled: "Just now" },
    { id: 2, name: "Main HQ Switch", ip: "192.168.1.2", type: "Switch", status: "Up", polled: "2 mins ago" },
    { id: 3, name: "Data Server 01", ip: "192.168.1.10", type: "Server", status: "Up", polled: "5 mins ago" },
    { id: 4, name: "Remote Office AP", ip: "192.168.2.5", type: "Access Point", status: "Down", polled: "1 hr ago" }
  ];

  function renderDeviceTable() {
    const tbody = document.getElementById("device-rows");
    tbody.innerHTML = devices.map(d => `
      <tr>
        <td><strong>${d.name}</strong></td>
        <td>${d.ip}</td>
        <td>${d.type}</td>
        <td><span class="badge ${d.status.toLowerCase()}">${d.status}</span></td>
        <td>${d.polled}</td>
        <td><button class="action-btn-danger" onclick="deleteDeviceItem(${d.id})">Delete</button></td>
      </tr>
    `).join('');
    localStorage.setItem("network_devices", JSON.stringify(devices));
  }

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devices - Kiambu Internet Solution</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 flex min-h-screen">
    <!-- Sidebar -->
    <aside class="w-64 bg-slate-800 border-r border-slate-700 flex flex-col justify-between p-6">
        <div>
            <h2 class="text-xl font-bold text-sky-400 mb-8">KIS Portal</h2>
            <nav class="space-y-2">
                <a href="dashboard.html" class="block py-2.5 px-4 rounded text-slate-300 hover:bg-slate-700">Dashboard</a>
                <a href="devices.html" class="block py-2.5 px-4 rounded bg-sky-600 text-white font-medium">Devices</a>
                <a href="traffic.html" class="block py-2.5 px-4 rounded text-slate-300 hover:bg-slate-700">Traffic</a>
                <a href="reports.html" class="block py-2.5 px-4 rounded text-slate-300 hover:bg-slate-700">Reports</a>
            </nav>
        </div>
        <button onclick="logout()" class="w-full bg-red-600 hover:bg-red-500 text-white font-medium py-2 rounded transition">Logout</button>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-10">
        <header class="flex justify-between items-center mb-8 pb-4 border-b border-slate-800">
            <h1 class="text-3xl font-bold">Device Management</h1>
            <button onclick="openAddModal()" class="bg-sky-600 hover:bg-sky-500 px-4 py-2 rounded text-sm font-medium transition">Add New Device</button>
        </header>

        <!-- Devices Table -->
        <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden shadow">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-slate-700/50 text-slate-400 text-sm border-b border-slate-700">
                        <th class="p-4">Device Name</th>
                        <th class="p-4">IP Address</th>
                        <th class="p-4">Status</th>
                        <th class="p-4 text-right">Actions</th>
                    </tr>
                </thead>
                <tbody id="device-table-body" class="divide-y divide-slate-700">
                    <!-- Dynamic Rows injected via script -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- Edit Modal -->
    <div id="device-modal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center">
        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 w-full max-w-md">
            <h2 id="modal-title" class="text-xl font-bold mb-4">Add Device</h2>
            <input type="hidden" id="device-index">
            <div class="mb-4">
                <label class="block text-sm mb-1">Device Name</label>
                <input type="text" id="dev-name" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded">
            </div>
            <div class="mb-4">
                <label class="block text-sm mb-1">IP Address</label>
                <input type="text" id="dev-ip" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded">
            </div>
            <div class="mb-6">
                <label class="block text-sm mb-1">Status</label>
                <select id="dev-status" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded">
                    <option value="Online">Online</option>
                    <option value="Offline">Offline</option>
                </select>
            </div>
            <div class="flex justify-end space-x-3">
                <button onclick="closeModal()" class="px-4 py-2 bg-slate-700 rounded hover:bg-slate-600">Cancel</button>
                <button onclick="saveDevice()" class="px-4 py-2 bg-sky-600 rounded hover:bg-sky-500">Save</button>
            </div>
        </div>
    </div>

    <script>
        if (!localStorage.getItem('kis_logged_in')) window.location.href = 'index.html';

        let devices = JSON.parse(localStorage.getItem('kis_devices')) || [
            { name: 'Kiambu Core Router', ip: '192.168.1.1', status: 'Online' },
            { name: 'Ruiru Distribution Switch', ip: '192.168.2.1', status: 'Online' },
            { name: 'Thika Gateway Node', ip: '192.168.3.1', status: 'Offline' }
        ];

        function renderDevices() {
            const tbody = document.getElementById('device-table-body');
            tbody.innerHTML = '';
            devices.forEach((d, index) => {
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-700/20">
                        <td class="p-4 font-medium">${d.name}</td>
                        <td class="p-4 text-slate-300">${d.ip}</td>
                        <td class="p-4"><span class="px-2.5 py-1 rounded-full text-xs font-semibold ${d.status === 'Online' ? 'bg-green-900/50 text-green-300 border border-green-700' : 'bg-red-900/50 text-red-300 border border-red-700'}">${d.status}</span></td>
                        <td class="p-4 text-right space-x-2">
                            <button onclick="openEditModal(${index})" class="text-sky-400 hover:underline">Edit</button>
                            <button onclick="deleteDevice(${index})" class="text-red-400 hover:underline">Delete</button>
                        </td>
                    </tr>
                `;
            });
            localStorage.setItem('kis_devices', JSON.stringify(devices));
        }

        function openAddModal() {
            document.getElementById('modal-title').innerText = 'Add Device';
            document.getElementById('device-index').value = '';
            document.getElementById('dev-name').value = '';
            document.getElementById('dev-ip').value = '';
            document.getElementById('device-modal').classList.remove('hidden');
        }

        function openEditModal(index) {
            document.getElementById('modal-title').innerText = 'Edit Device';
            document.getElementById('device-index').value = index;
            document.getElementById('dev-name').value = devices[index].name;
            document.getElementById('dev-ip').value = devices[index].ip;
            document.getElementById('dev-status').value = devices[index].status;
            document.getElementById('device-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('device-modal').classList.add('hidden');
        }

        function saveDevice() {
            const index = document.getElementById('device-index').value;
            const name = document.getElementById('dev-name').value.trim();
            const ip = document.getElementById('dev-ip').value.trim();
            const status = document.getElementById('dev-status').value;

            if (!name || !ip) return alert('Please fill in all fields.');

            if (index === '') {
                devices.push({ name, ip, status });
            } else {
                devices[index] = { name, ip, status };
            }

            closeModal();
            renderDevices();
        }

        function deleteDevice(index) {
            if (confirm('Are you sure you want to delete this device?')) {
                devices.splice(index, 1);
                renderDevices();
            }
        }

        function logout() {
            localStorage.removeItem('kis_logged_in');
            window.location.href = 'index.html';
        }

        renderDevices();
    </script>
</body>
</html>

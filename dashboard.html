<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Kiambu Internet Solution</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 flex min-h-screen">
    <!-- Sidebar -->
    <aside class="w-64 bg-slate-800 border-r border-slate-700 flex flex-col justify-between p-6">
        <div>
            <h2 class="text-xl font-bold text-sky-400 mb-8">KIS Portal</h2>
            <nav class="space-y-2">
                <a href="dashboard.html" class="block py-2.5 px-4 rounded bg-sky-600 text-white font-medium">Dashboard</a>
                <a href="devices.html" class="block py-2.5 px-4 rounded text-slate-300 hover:bg-slate-700">Devices</a>
                <a href="traffic.html" class="block py-2.5 px-4 rounded text-slate-300 hover:bg-slate-700">Traffic</a>
                <a href="reports.html" class="block py-2.5 px-4 rounded text-slate-300 hover:bg-slate-700">Reports</a>
            </nav>
        </div>
        <button onclick="logout()" class="w-full bg-red-600 hover:bg-red-500 text-white font-medium py-2 rounded transition">Logout</button>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-10">
        <header class="flex justify-between items-center mb-8 pb-4 border-b border-slate-800">
            <h1 class="text-3xl font-bold">Network Overview</h1>
            <span id="user-display" class="text-sm text-slate-400"></span>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow">
                <h3 class="text-sm text-slate-400">Active Devices</h3>
                <p class="text-3xl font-bold text-sky-400 mt-2">24 / 26</p>
            </div>
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow">
                <h3 class="text-sm text-slate-400">Current Bandwidth Usage</h3>
                <p class="text-3xl font-bold text-emerald-400 mt-2">420.5 Mbps</p>
            </div>
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow">
                <h3 class="text-sm text-slate-400">System Status</h3>
                <p class="text-3xl font-bold text-green-400 mt-2">Optimal</p>
            </div>
        </div>
    </main>

    <script>
        // Check authentication guard
        const currentUser = localStorage.getItem('kis_logged_in');
        if (!currentUser) {
            window.location.href = 'index.html';
        } else {
            document.getElementById('user-display').innerText = `Logged in as: ${currentUser}`;
        }

        function logout() {
            localStorage.removeItem('kis_logged_in');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>

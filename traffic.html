<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic - Kiambu Internet Solution</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 flex min-h-screen">
    <!-- Sidebar -->
    <aside class="w-64 bg-slate-800 border-r border-slate-700 flex flex-col justify-between p-6">
        <div>
            <h2 class="text-xl font-bold text-sky-400 mb-8">KIS Portal</h2>
            <nav class="space-y-2">
                <a href="dashboard.html" class="block py-2.5 px-4 rounded text-slate-300 hover:bg-slate-700">Dashboard</a>
                <a href="devices.html" class="block py-2.5 px-4 rounded text-slate-300 hover:bg-slate-700">Devices</a>
                <a href="traffic.html" class="block py-2.5 px-4 rounded bg-sky-600 text-white font-medium">Traffic</a>
                <a href="reports.html" class="block py-2.5 px-4 rounded text-slate-300 hover:bg-slate-700">Reports</a>
            </nav>
        </div>
        <button onclick="logout()" class="w-full bg-red-600 hover:bg-red-500 text-white font-medium py-2 rounded transition">Logout</button>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-10">
        <header class="flex justify-between items-center mb-8 pb-4 border-b border-slate-800">
            <h1 class="text-3xl font-bold">Network Traffic Streams</h1>
            <button onclick="openAddModal()" class="bg-sky-600 hover:bg-sky-500 px-4 py-2 rounded text-sm font-medium transition">Add Traffic Feed</button>
        </header>

        <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden shadow">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-slate-700/50 text-slate-400 text-sm border-b border-slate-700">
                        <th class="p-4">Node / Segment</th>
                        <th class="p-4">Inbound Rate</th>
                        <th class="p-4">Outbound Rate</th>
                        <th class="p-4 text-right">Actions</th>
                    </tr>
                </thead>
                <tbody id="traffic-table-body" class="divide-y divide-slate-700"></tbody>
            </table>
        </div>
    </main>

    <!-- Modal -->
    <div id="traffic-modal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center">
        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 w-full max-w-md">
            <h2 id="modal-title" class="text-xl font-bold mb-4">Edit Traffic Stream</h2>
            <input type="hidden" id="traffic-index">
            <div class="mb-4">
                <label class="block text-sm mb-1">Segment Name</label>
                <input type="text" id="tr-node" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded">
            </div>
            <div class="mb-4">
                <label class="block text-sm mb-1">Inbound Rate</label>
                <input type="text" id="tr-in" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded">
            </div>
            <div class="mb-6">
                <label class="block text-sm mb-1">Outbound Rate</label>
                <input type="text" id="tr-out" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded">
            </div>
            <div class="flex justify-end space-x-3">
                <button onclick="closeModal()" class="px-4 py-2 bg-slate-700 rounded">Cancel</button>
                <button onclick="saveTraffic()" class="px-4 py-2 bg-sky-600 rounded">Save</button>
            </div>
        </div>
    </div>

    <script>
        if (!localStorage.getItem('kis_logged_in')) window.location.href = 'index.html';

        let trafficData = JSON.parse(localStorage.getItem('kis_traffic')) || [
            { node: 'Kiambu Main Backbone', inbound: '145.2 Mbps', outbound: '98.4 Mbps' },
            { node: 'Township Sub-Network', inbound: '64.1 Mbps', outbound: '45.0 Mbps' }
        ];

        function renderTraffic() {
            const tbody = document.getElementById('traffic-table-body');
            tbody.innerHTML = '';
            trafficData.forEach((t, index) => {
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-700/20">
                        <td class="p-4 font-medium">${t.node}</td>
                        <td class="p-4 text-emerald-400">${t.inbound}</td>
                        <td class="p-4 text-sky-400">${t.outbound}</td>
                        <td class="p-4 text-right space-x-2">
                            <button onclick="openEditModal(${index})" class="text-sky-400 hover:underline">Edit</button>
                            <button onclick="deleteTraffic(${index})" class="text-red-400 hover:underline">Delete</button>
                        </td>
                    </tr>
                `;
            });
            localStorage.setItem('kis_traffic', JSON.stringify(trafficData));
        }

        function openAddModal() {
            document.getElementById('modal-title').innerText = 'Add Traffic Feed';
            document.getElementById('traffic-index').value = '';
            document.getElementById('tr-node').value = '';
            document.getElementById('tr-in').value = '';
            document.getElementById('tr-out').value = '';
            document.getElementById('traffic-modal').classList.remove('hidden');
        }

        function openEditModal(index) {
            document.getElementById('modal-title').innerText = 'Edit Traffic Stream';
            document.getElementById('traffic-index').value = index;
            document.getElementById('tr-node').value = trafficData[index].node;
            document.getElementById('tr-in').value = trafficData[index].inbound;
            document.getElementById('tr-out').value = trafficData[index].outbound;
            document.getElementById('traffic-modal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('traffic-modal').classList.add('hidden'); }

        function saveTraffic() {
            const index = document.getElementById('traffic-index').value;
            const node = document.getElementById('tr-node').value.trim();
            const inbound = document.getElementById('tr-in').value.trim();
            const outbound = document.getElementById('tr-out').value.trim();

            if (!node) return;
            if (index === '') trafficData.push({ node, inbound, outbound });
            else trafficData[index] = { node, inbound, outbound };

            closeModal();
            renderTraffic();
        }

        function deleteTraffic(index) {
            trafficData.splice(index, 1);
            renderTraffic();
        }

        function logout() { localStorage.removeItem('kis_logged_in'); window.location.href = 'index.html'; }
        renderTraffic();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Kiambu Internet Solutions</title>
    <style>
        :root { --navy: #1b365d; --navy-dark: #0f213c; --danger: #d93025; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body.login-body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--navy-dark); overflow: hidden; position: relative; }
        .bg-video, #network-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
        .video-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11, 25, 48, 0.72); z-index: 1; }
        .login-card { position: relative; z-index: 2; width: 92%; max-width: 440px; background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(10px); border-radius: 10px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .card-header-navy { background: var(--navy); color: #fff; padding: 18px 20px; text-align: center; font-size: 1.15rem; font-weight: 700; }
        .login-form-wrap { padding: 28px 32px; }
        .login-form-wrap h2 { text-align: center; color: var(--navy); margin-bottom: 20px; font-size: 1.25rem; }
        .form-group { margin-bottom: 15px; }
        .form-group input, .form-group select { width: 100%; padding: 12px 14px; border: 1.5px solid #444; border-radius: 5px; font-size: 0.95rem; }
        .btn-primary { width: 100%; padding: 12px; background: var(--navy); color: #fff; border: none; border-radius: 5px; font-size: 1rem; font-weight: 600; cursor: pointer; }
        .btn-primary:hover { background: #132744; }
        .auth-links { text-align: center; font-size: 0.88rem; color: #555; margin-top: 16px; }
        .auth-links a { color: var(--navy); font-weight: 600; text-decoration: none; }
        .alert-error { background: #fdecea; color: var(--danger); padding: 10px; border-radius: 5px; margin-bottom: 14px; font-size: 0.9rem; border: 1px solid #f5c6cb; display: none; }
    </style>
</head>
<body class="login-body">
    <video autoplay muted loop playsinline poster="login-bg.png" class="bg-video">
        <source src="network-bg.mp4" type="video/mp4">
    </video>
    <canvas id="network-canvas"></canvas>
    <div class="video-overlay"></div>

    <div class="login-card">
        <div class="card-header-navy">Kiambu Internet Solutions - Sign Up</div>
        <div class="login-form-wrap">
            <h2>Create Staff Account</h2>
            <div id="reg-error" class="alert-error"></div>

            <form id="register-form">
                <div class="form-group"><input type="text" id="reg-username" placeholder="Choose Username" required></div>
                <div class="form-group"><input type="email" id="reg-email" placeholder="Work Email Address" required></div>
                <div class="form-group">
                    <select id="reg-role">
                        <option value="Technician">Role: Technician</option>
                        <option value="Management">Role: Management</option>
                    </select>
                </div>
                <div class="form-group"><input type="password" id="reg-password" placeholder="Create Password (min 6 chars)" required></div>
                <button type="submit" class="btn-primary">Create Account</button>
            </form>

            <div class="auth-links">
                Already have an account? <a href="index.html">Back to Login</a>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('network-canvas');
        const ctx = canvas.getContext('2d');
        let width, height, particles;
        function initCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            particles = Array.from({ length: 65 }, () => ({
                x: Math.random() * width, y: Math.random() * height,
                vx: (Math.random() - 0.5) * 0.6, vy: (Math.random() - 0.5) * 0.6, r: Math.random() * 2 + 1.5
            }));
        }
        function drawCanvas() {
            ctx.clearRect(0, 0, width, height);
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                p.x += p.vx; p.y += p.vy;
                if (p.x < 0 || p.x > width) p.vx *= -1;
                if (p.y < 0 || p.y > height) p.vy *= -1;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = '#00d2ff'; ctx.fill();
                for (let j = i + 1; j < particles.length; j++) {
                    const p2 = particles[j];
                    const dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                    if (dist < 140) {
                        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p2.x, p2.y);
                        ctx.strokeStyle = `rgba(0, 210, 255, ${1 - dist / 140})`;
                        ctx.lineWidth = 0.7; ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(drawCanvas);
        }
        window.addEventListener('resize', initCanvas);
        initCanvas(); drawCanvas();

        if (!localStorage.getItem('kis_users')) {
            localStorage.setItem('kis_users', JSON.stringify([
                { username: 'admin', email: 'admin@kiambuinetsolutions.co.ke', password: 'password123', role: 'Management' },
                { username: 'permenus', email: 'permenus@kiambuinetsolutions.co.ke', password: 'password123', role: 'Technician' }
            ]));
        }

        document.getElementById('register-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('reg-username').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const role = document.getElementById('reg-role').value;
            const password = document.getElementById('reg-password').value;
            const err = document.getElementById('reg-error');

            if (password.length < 6) {
                err.textContent = 'Password must be at least 6 characters.';
                err.style.display = 'block';
                return;
            }

            const users = JSON.parse(localStorage.getItem('kis_users') || '[]');
            if (users.some(u => u.username === username || u.email === email)) {
                err.textContent = 'Username or email is already registered.';
                err.style.display = 'block';
                return;
            }

            users.push({ username, email, password, role });
            localStorage.setItem('kis_users', JSON.stringify(users));
            window.location.href = 'index.html?registered=1';
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate Report | Kiambu Internet Solutions</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="app-body">

<div class="topbar">
    <div class="brand">Kiambu Internet Solutions - Network Monitor</div>
    <nav>
        <a href="dashboard.html">Device Dashboard</a>
        <a href="traffic-log.html">Traffic Log</a>
        <a href="reports.html" class="active">Reports</a>
        <a onclick="logoutUser()">Logout (<span id="nav-username"></span>)</a>
    </nav>
</div>

<div class="container" style="max-width: 540px;">
    <div class="panel">
        <div class="card-header-navy">Generate Report</div>
        <div style="padding: 28px;">
            <div class="form-group">
                <select id="report-type">
                    <option value="traffic">Report Type: Traffic Summary</option>
                    <option value="status">Report Type: Device Status</option>
                </select>
            </div>
            <div class="form-group">
                <select id="report-device">
                    <option value="all">Device: All devices</option>
                </select>
            </div>
            <div class="form-group">
                <select id="report-period">
                    <option value="24">Polling Period: Last 24 hours</option>
                    <option value="168">Polling Period: Last 7 days</option>
                    <option value="720">Polling Period: Last 30 days</option>
                </select>
            </div>
            <button type="button" class="btn-primary" onclick="downloadCSV()">Download CSV Report</button>
            <button type="button" onclick="window.print()" class="btn-sm btn-outline" style="width:100%; margin-top:10px; padding:10px;">Print / Save as PDF</button>
            <p style="text-align:center; color:#666; font-size:0.85rem; margin-top:16px;">Report can be downloaded as PDF or CSV</p>
        </div>
    </div>
</div>

<script src="assets/js/app.js"></script>
<script>
    requireAuth();

    const devSelect = document.getElementById('report-device');
    getDevices().forEach(d => {
        const opt = document.createElement('option');
        opt.value = d.name;
        opt.textContent = `Device: ${d.name}`;
        devSelect.appendChild(opt);
    });

    function downloadCSV() {
        const type = document.getElementById('report-type').value;
        const deviceFilter = devSelect.value;
        let csvContent = "data:text/csv;charset=utf-8,";

        if (type === 'status') {
            csvContent += "Device Name,IP Address,Type,Status,Last Polled\n";
            getDevices()
                .filter(d => deviceFilter === 'all' || d.name === deviceFilter)
                .forEach(d => {
                    csvContent += `${d.name},${d.ip},${d.type},${d.status},${d.lastPolled}\n`;
                });
        } else {
            csvContent += "Timestamp,Device,Bytes In (MB),Bytes Out (MB),Status\n";
            getLogs()
                .filter(l => deviceFilter === 'all' || l.device === deviceFilter)
                .forEach(l => {
                    csvContent += `${l.timestamp},${l.device},${l.bytesInMB},${l.bytesOutMB},${l.status}\n`;
                });
        }

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `kiambu_${type}_report.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>
</body>
</html>

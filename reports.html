<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports - Kiambu Internet Solution</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #0f172a; color: #f1f5f9; display: flex; min-height: 100vh; }
        
        /* Sidebar */
        aside { width: 256px; background-color: #1e293b; border-right: 1px solid #334155; display: flex; flex-direction: column; justify-content: space-between; padding: 24px; }
        aside h2 { font-size: 1.25rem; font-weight: 700; color: #38bdf8; margin-bottom: 32px; }
        nav a { display: block; padding: 10px 16px; border-radius: 6px; color: #cbd5e1; text-decoration: none; margin-bottom: 8px; }
        nav a:hover { background-color: #334155; }
        nav a.active { background-color: #0284c7; color: #ffffff; font-weight: 500; }
        .btn-logout { width: 100%; background-color: #dc2626; color: #fff; border: none; padding: 10px; border-radius: 6px; font-weight: 500; cursor: pointer; }
        .btn-logout:hover { background-color: #ef4444; }

        /* Main Content */
        main { flex: 1; padding: 40px; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; padding-bottom: 16px; border-bottom: 1px solid #1e293b; }
        header h1 { font-size: 1.875rem; font-weight: 700; }
        .btn { padding: 8px 16px; border-radius: 6px; border: none; color: #fff; font-size: 0.875rem; font-weight: 500; cursor: pointer; }
        .btn-primary { background-color: #0284c7; }
        .btn-primary:hover { background-color: #0ea5e9; }
        .btn-secondary { background-color: #334155; }
        .btn-secondary:hover { background-color: #475569; }

        /* Table */
        .table-card { background-color: #1e293b; border-radius: 12px; border: 1px solid #334155; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        thead tr { background-color: rgba(51, 65, 85, 0.5); color: #94a3b8; font-size: 0.875rem; border-bottom: 1px solid #334155; }
        th, td { padding: 16px; }
        tbody tr { border-bottom: 1px solid #334155; }
        tbody tr:last-child { border-bottom: none; }
        tbody tr:hover { background-color: rgba(51, 65, 85, 0.2); }
        .text-right { text-align: right; }
        .type-badge { color: #38bdf8; }
        .action-btn { background: none; border: none; cursor: pointer; font-size: 0.95rem; margin-left: 12px; }
        .action-btn:hover { text-decoration: underline; }
        .text-save { color: #34d399; font-weight: 600; }
        .text-edit { color: #38bdf8; }
        .text-delete { color: #f87171; }

        /* Modal */
        .modal-overlay { position: fixed; inset: 0; background-color: rgba(0, 0, 0, 0.7); display: flex; align-items: center; justify-content: center; z-index: 999; }
        .hidden { display: none !important; }
        .modal-box { background-color: #1e293b; padding: 24px; border-radius: 12px; border: 1px solid #334155; width: 100%; max-width: 440px; }
        .modal-box h2 { font-size: 1.25rem; font-weight: 700; margin-bottom: 16px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.875rem; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 8px 12px; background-color: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #f1f5f9; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px; }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <aside>
        <div>
            <h2>KIS Portal</h2>
            <nav>
                <a href="dashboard.html">Dashboard</a>
                <a href="devices.html">Devices</a>
                <a href="traffic.html">Traffic</a>
                <a href="reports.html" class="active">Reports</a>
            </nav>
        </div>
        <button type="button" onclick="logout()" class="btn-logout">Logout</button>
    </aside>

    <!-- Main Content -->
    <main>
        <header>
            <h1>Network Reports & Logs</h1>
            <button type="button" onclick="openAddModal()" class="btn btn-primary">Create Report</button>
        </header>

        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th>Report Title</th>
                        <th>Date Generated</th>
                        <th>Type</th>
                        <th class="text-right">Actions</th>
                    </tr>
                </thead>
                <tbody id="reports-table-body"></tbody>
            </table>
        </div>
    </main>

    <!-- Modal -->
    <div id="report-modal" class="modal-overlay hidden">
        <div class="modal-box">
            <h2 id="modal-title">Create Report</h2>
            <input type="hidden" id="report-index">
            <div class="form-group">
                <label>Report Title</label>
                <input type="text" id="rep-title" placeholder="Enter report title">
            </div>
            <div class="form-group">
                <label>Date</label>
                <input type="date" id="rep-date">
            </div>
            <div class="form-group">
                <label>Type</label>
                <input type="text" id="rep-type" placeholder="e.g. Audit, Incident, Performance">
            </div>
            <div class="modal-footer">
                <button type="button" onclick="closeModal()" class="btn btn-secondary">Cancel</button>
                <button type="button" onclick="saveReport()" class="btn btn-primary">Save</button>
            </div>
        </div>
    </div>

    <script>
        var reports = [
            { title: 'Monthly Bandwidth Audit - Nov', date: '2026-11-01', type: 'Audit' },
            { title: 'Node Outage Incident Log', date: '2026-11-05', type: 'Incident' }
        ];

        try {
            var saved = localStorage.getItem('kis_reports');
            if (saved) {
                var parsed = JSON.parse(saved);
                if (Array.isArray(parsed) && parsed.length > 0) {
                    reports = parsed;
                }
            }
        } catch (e) {}

        function saveToStorage() {
            try {
                localStorage.setItem('kis_reports', JSON.stringify(reports));
            } catch (e) {}
        }

        function getTodayDate() {
            var d = new Date();
            var y = d.getFullYear();
            var m = String(d.getMonth() + 1).padStart(2, '0');
            var day = String(d.getDate()).padStart(2, '0');
            return y + '-' + m + '-' + day;
        }

        function renderReports() {
            var tbody = document.getElementById('reports-table-body');
            tbody.innerHTML = '';

            for (var i = 0; i < reports.length; i++) {
                var r = reports.slice(i, i + 1).pop();
                var tr = document.createElement('tr');
                tr.innerHTML =
                    '<td style="font-weight: 500;">' + r.title + '</td>' +
                    '<td style="color: #cbd5e1;">' + r.date + '</td>' +
                    '<td class="type-badge">' + r.type + '</td>' +
                    '<td class="text-right">' +
                        '<button type="button" onclick="saveWord(' + i + ')" class="action-btn text-save">Save</button>' +
                        '<button type="button" onclick="openEditModal(' + i + ')" class="action-btn text-edit">Edit</button>' +
                        '<button type="button" onclick="deleteReport(' + i + ')" class="action-btn text-delete">Delete</button>' +
                    '</td>';
                tbody.appendChild(tr);
            }
            saveToStorage();
        }

        function saveWord(index) {
            var r = reports.slice(index, index + 1).pop();
            if (!r) return;

            var docContent =
                "<html xmlns:o='urn:schemas-microsoft-com:office:office' " +
                "xmlns:w='urn:schemas-microsoft-com:office:word' " +
                "xmlns='http://w3.org'>" +
                "<head><meta charset='utf-8'><title>" + r.title + "</title></head>" +
                "<body style='font-family: Arial, sans-serif; color: #1e293b;'>" +
                "<h2 style='color: #0284c7; margin-bottom: 4px;'>Kiambu Internet Solution (KIS Portal)</h2>" +
                "<p style='color: #64748b; font-size: 12px; margin-top: 0;'>Generated on " + getTodayDate() + "</p>" +
                "<hr style='border: 1px solid #cbd5e1;'>" +
                "<h3>" + r.title + "</h3>" +
                "<table border='1' cellpadding='8' cellspacing='0' style='border-collapse: collapse; width: 100%; border-color: #cbd5e1;'>" +
                "<tr><th style='background-color: #f1f5f9; text-align: left; width: 30%;'>Report Title</th><td>" + r.title + "</td></tr>" +
                "<tr><th style='background-color: #f1f5f9; text-align: left;'>Date Generated</th><td>" + r.date + "</td></tr>" +
                "<tr><th style='background-color: #f1f5f9; text-align: left;'>Report Type</th><td>" + r.type + "</td></tr>" +
                "</table>" +
                "</body></html>";

            var filename = r.title.replace(/[^a-z0-9_-]/gi, '_') + '.doc';
            var blob = new Blob(['\ufeff', docContent], { type: 'application/msword' });
            var url = URL.createObjectURL(blob);

            var a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
        }

        function openAddModal() {

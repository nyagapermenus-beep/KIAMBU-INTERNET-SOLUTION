<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports - Kiambu Internet Solution</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 flex min-h-screen">
    <!-- Sidebar -->
    <aside class="w-64 bg-slate-800 border-r border-slate-700 flex flex-col justify-between p-6">
        <div>
            <h2 class="text-xl font-bold text-sky-400 mb-8">KIS Portal</h2>
            <nav class="space-y-2">
                <a href="dashboard.html" class="block py-2.5 px-4 rounded text-slate-300 hover:bg-slate-700">Dashboard</a>
                <a href="devices.html" class="block py-2.5 px-4 rounded text-slate-300 hover:bg-slate-700">Devices</a>
                <a href="traffic.html" class="block py-2.5 px-4 rounded text-slate-300 hover:bg-slate-700">Traffic</a>
                <a href="reports.html" class="block py-2.5 px-4 rounded bg-sky-600 text-white font-medium">Reports</a>
            </nav>
        </div>
        <button type="button" onclick="logout()" class="w-full bg-red-600 hover:bg-red-500 text-white font-medium py-2 rounded transition">Logout</button>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-10">
        <header class="flex justify-between items-center mb-8 pb-4 border-b border-slate-800">
            <h1 class="text-3xl font-bold">Network Reports & Logs</h1>
            <div class="space-x-3">
                <button type="button" onclick="saveAllReportsWord()" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded text-sm font-medium transition">Save All as Word</button>
                <button type="button" onclick="openAddModal()" class="bg-sky-600 hover:bg-sky-500 px-4 py-2 rounded text-sm font-medium transition">Create Report</button>
            </div>
        </header>

        <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden shadow">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-slate-700/50 text-slate-400 text-sm border-b border-slate-700">
                        <th class="p-4">Report Title</th>
                        <th class="p-4">Date Generated</th>
                        <th class="p-4">Type</th>
                        <th class="p-4 text-right">Actions</th>
                    </tr>
                </thead>
                <tbody id="reports-table-body" class="divide-y divide-slate-700"></tbody>
            </table>
        </div>
    </main>

    <!-- Modal -->
    <div id="report-modal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50">
        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 w-full max-w-md">
            <h2 id="modal-title" class="text-xl font-bold mb-4">Create Report</h2>
            <input type="hidden" id="report-index">
            <div class="mb-4">
                <label class="block text-sm mb-1">Report Title</label>
                <input type="text" id="rep-title" placeholder="Enter report title" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded">
            </div>
            <div class="mb-4">
                <label class="block text-sm mb-1">Date</label>
                <input type="date" id="rep-date" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded">
            </div>
            <div class="mb-6">
                <label class="block text-sm mb-1">Type</label>
                <input type="text" id="rep-type" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded">
            </div>
            <div class="flex justify-end space-x-3">
                <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded">Cancel</button>
                <button type="button" onclick="saveReport()" class="px-4 py-2 bg-sky-600 hover:bg-sky-500 rounded">Save</button>
            </div>
        </div>
    </div>

    <script>
        if (!localStorage.getItem('kis_logged_in')) window.location.href = 'index.html';

        let reports = JSON.parse(localStorage.getItem('kis_reports')) || [
            { title: 'Monthly Bandwidth Audit - Nov', date: '2026-11-01', type: 'Audit' },
            { title: 'Node Outage Incident Log', date: '2026-11-05', type: 'Incident' }
        ];

        function renderReports() {
            const tbody = document.getElementById('reports-table-body');
            tbody.innerHTML = '';
            reports.forEach((r, index) => {
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-700/20">
                        <td class="p-4 font-medium">${r.title}</td>
                        <td class="p-4 text-slate-300">${r.date}</td>
                        <td class="p-4 text-sky-400">${r.type}</td>
                        <td class="p-4 text-right space-x-3">
                            <button type="button" onclick="saveSingleReportWord(${index})" class="text-emerald-400 hover:underline">Save</button>
                            <button type="button" onclick="openEditModal(${index})" class="text-sky-400 hover:underline">Edit</button>
                            <button type="button" onclick="deleteReport(${index})" class="text-red-400 hover:underline">Delete</button>
                        </td>
                    </tr>
                `;
            });
            localStorage.setItem('kis_reports', JSON.stringify(reports));
        }

        function downloadWordDoc(filename, bodyHtml) {
            const fullHtml = `
                <html xmlns:o='urn:schemas-microsoft-com:office:office' 
                      xmlns:w='urn:schemas-microsoft-com:office:word' 
                      xmlns='http://w3.org'>
                <head><meta charset='utf-8'><title>${filename}</title></head>
                <body style="font-family: Arial, sans-serif; color: #1e293b;">
                    <h2 style="color: #0284c7; margin-bottom: 4px;">Kiambu Internet Solution (KIS Portal)</h2>
                    <p style="color: #64748b; font-size: 12px; margin-top: 0;">Generated on ${new Date().toLocaleDateString()}</p>
                    <hr style="border: 1px solid #cbd5e1;">
                    ${bodyHtml}
                </body>
                </html>
            `;

            const blob = new Blob(['\ufeff', fullHtml], { type: 'application/msword' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `${filename.replace(/[^a-z0-9_-]/gi, '_')}.doc`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            setTimeout(() => URL.revokeObjectURL(url), 100);
        }

        function saveSingleReportWord(index) {
            const r = reports[index];
            if (!r) return;
            const content = `
                <h3>${r.title}</h3>
                <table border="1" cellpadding="8" cellspacing="0" style="border-collapse: collapse; width: 100%; border-color: #cbd5e1;">
                    <tr>
                        <th style="background-color: #f1f5f9; text-align: left; width: 30%;">Report Title</th>
                        <td>${r.title}</td>
                    </tr>
                    <tr>
                        <th style="background-color: #f1f5f9; text-align: left;">Date Generated</th>
                        <td>${r.date}</td>
                    </tr>
                    <tr>
                        <th style="background-color: #f1f5f9; text-align: left;">Report Type</th>
                        <td>${r.type}</td>
                    </tr>
                </table>
            `;
            downloadWordDoc(r.title, content);
        }

        function saveAllReportsWord() {
            if (reports.length === 0) return alert('No reports available to save.');
            const rows = reports.map(r => `
                <tr>
                    <td>${r.title}</td>
                    <td>${r.date}</td>
                    <td>${r.type}</td>
                </tr>
            `).join('');

            const content = `
                <h3>All Network Reports & Logs</h3>
                <table border="1" cellpadding="8" cellspacing="0" style="border-collapse: collapse; width: 100%; border-color: #cbd5e1;">
                    <thead>
                        <tr style="background-color: #f1f5f9;">
                            <th style="text-align: left;">Report Title</th>
                            <th style="text-align: left;">Date Generated</th>
                            <th style="text-align: left;">Type</th>
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>
            `;
            downloadWordDoc('KIS_Network_Reports', content);
        }

        function openAddModal() {
            document.getElementById('modal-title').innerText = 'Create Report';
            document.getElementById('report-index').value = '';
            document.getElementById('rep-title').value = '';
            document.getElementById('rep-date').value = new Date().toISOString().split('T')[0];
            document.getElementById('rep-type').value = 'Performance';
            document.getElementById('report-modal').classList.remove('hidden');
        }

        function openEditModal(index) {
            document.getElementById('modal-title').innerText = 'Edit Report';
            document.getElementById('report-index').value = index;
            document.getElementById('rep-title').value = reports[index].title;
            document.getElementById('rep-date').value = reports[index].date;
            document.getElementById('rep-type').value = reports[index].type;

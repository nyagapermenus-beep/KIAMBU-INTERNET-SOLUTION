<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports - Kiambu Internet Solution</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 flex min-h-screen">
    <!-- Sidebar -->
    <aside class="w-64 bg-slate-800 border-r border-slate-700 flex flex-col justify-between p-6">
        <div>
            <h2 class="text-xl font-bold text-sky-400 mb-8">KIS Portal</h2>
            <nav class="space-y-2">
                <a href="dashboard.html" class="block py-2.5 px-4 rounded text-slate-300 hover:bg-slate-700">Dashboard</a>
                <a href="devices.html" class="block py-2.5 px-4 rounded text-slate-300 hover:bg-slate-700">Devices</a>
                <a href="traffic.html" class="block py-2.5 px-4 rounded text-slate-300 hover:bg-slate-700">Traffic</a>
                <a href="reports.html" class="block py-2.5 px-4 rounded bg-sky-600 text-white font-medium">Reports</a>
            </nav>
        </div>
        <button onclick="logout()" class="w-full bg-red-600 hover:bg-red-500 text-white font-medium py-2 rounded transition">Logout</button>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-10">
        <header class="flex justify-between items-center mb-8 pb-4 border-b border-slate-800">
            <h1 class="text-3xl font-bold">Network Reports & Logs</h1>
            <button onclick="openAddModal()" class="bg-sky-600 hover:bg-sky-500 px-4 py-2 rounded text-sm font-medium transition">Create Report</button>
        </header>

        <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden shadow">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-slate-700/50 text-slate-400 text-sm border-b border-slate-700">
                        <th class="p-4">Report Title</th>
                        <th class="p-4">Date Generated</th>
                        <th class="p-4">Type</th>
                        <th class="p-4 text-right">Actions</th>
                    </tr>
                </thead>
                <tbody id="reports-table-body" class="divide-y divide-slate-700"></tbody>
            </table>
        </div>
    </main>

    <!-- Modal -->
    <div id="report-modal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center">
        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 w-full max-w-md">
            <h2 id="modal-title" class="text-xl font-bold mb-4">Edit Report</h2>
            <input type="hidden" id="report-index">
            <div class="mb-4">
                <label class="block text-sm mb-1">Report Title</label>
                <input type="text" id="rep-title" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded">
            </div>
            <div class="mb-4">
                <label class="block text-sm mb-1">Date</label>
                <input type="date" id="rep-date" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded">
            </div>
            <div class="mb-6">
                <label class="block text-sm mb-1">Type</label>
                <input type="text" id="rep-type" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded">
            </div>
            <div class="flex justify-end space-x-3">
                <button onclick="closeModal()" class="px-4 py-2 bg-slate-700 rounded">Cancel</button>
                <button onclick="saveReport()" class="px-4 py-2 bg-sky-600 rounded">Save</button>
            </div>
        </div>
    </div>

    <script>
        if (!localStorage.getItem('kis_logged_in')) window.location.href = 'index.html';

        let reports = JSON.parse(localStorage.getItem('kis_reports')) || [
            { title: 'Monthly Bandwidth Audit - Nov', date: '2026-11-01', type: 'Audit' },
            { title: 'Node Outage Incident Log', date: '2026-11-05', type: 'Incident' }
        ];

        function renderReports() {
            const tbody = document.getElementById('reports-table-body');
            tbody.innerHTML = '';
            reports.forEach((r, index) => {
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-700/20">
                        <td class="p-4 font-medium">${r.title}</td>
                        <td class="p-4 text-slate-300">${r.date}</td>
                        <td class="p-4 text-sky-400">${r.type}</td>
                        <td class="p-4 text-right space-x-2">
                            <button onclick="openEditModal(${index})" class="text-sky-400 hover:underline">Edit</button>
                            <button onclick="deleteReport(${index})" class="text-red-400 hover:underline">Delete</button>
                        </td>
                    </tr>
                `;
            });
            localStorage.setItem('kis_reports', JSON.stringify(reports));
        }

        function openAddModal() {
            document.getElementById('modal-title').innerText = 'Create Report';
            document.getElementById('report-index').value = '';
            document.getElementById('rep-title').value = '';
            document.getElementById('rep-date').value = new Date().toISOString().split('T')[0];
            document.getElementById('rep-type').value = 'Performance';
            document.getElementById('report-modal').classList.remove('hidden');
        }

        function openEditModal(index) {
            document.getElementById('modal-title').innerText = 'Edit Report';
            document.getElementById('report-index').value = index;
            document.getElementById('rep-title').value = reports[index].title;
            document.getElementById('rep-date').value = reports[index].date;
            document.getElementById('rep-type').value = reports[index].type;
            document.getElementById('report-modal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('report-modal').classList.add('hidden'); }

        function saveReport() {
            const index = document.getElementById('report-index').value;
            const title = document.getElementById('rep-title').value.trim();
            const date = document.getElementById('rep-date').value;
            const type = document.getElementById('rep-type').value.trim();

            if (!title) return;
            if (index === '') reports.push({ title, date, type });
            else reports[index] = { title, date, type };

            closeModal();
            renderReports();
        }

        function deleteReport(index) {
            reports.splice(index, 1);
            renderReports();
        }

        function logout() { localStorage.removeItem('kis_logged_in'); window.location.href = 'index.html'; }
        renderReports();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports | Kiambu Internet Solutions</title>
  <script src="https://jsdelivr.net"></script>
  <style>
    :root {
      --bg-dark: #0a0e17;
      --panel-bg: rgba(16, 24, 40, 0.75);
      --accent-cyan: #00d2ff;
      --accent-purple: #9d4edd;
      --accent-green: #39ff14;
      --accent-red: #ff3333;
      --text-main: #f0f4f8;
      --text-muted: #8a99ad;
      --border-cyber: rgba(0, 210, 255, 0.15);
      --terminal-font: 'Courier New', Courier, monospace;
    }
    body {
      margin: 0; padding: 0; background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 50% 0%, rgba(157, 78, 221, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(0, 210, 255, 0.12) 0px, transparent 50%),
        linear-gradient(rgba(18, 18, 18, 0.4) 1px, transparent 1px),
        linear-gradient(90deg, rgba(18, 18, 18, 0.4) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      color: var(--text-main);
    }
    .app-shell { display: flex; flex-direction: column; min-height: 100vh; }
    .topbar { display: flex; justify-content: space-between; align-items: center; background: rgba(10, 14, 23, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-cyber); padding: 15px 40px; box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5); }
    .top-brand { font-weight: 800; letter-spacing: 1.5px; color: var(--text-main); font-size: 18px; }
    .top-brand span { color: var(--accent-cyan); font-weight: 300; }
    .nav { display: flex; gap: 10px; }
    .nav a { color: var(--text-muted); text-decoration: none; padding: 8px 16px; border-radius: 6px; font-size: 14px; font-weight: 500; transition: all 0.3s ease; border: 1px solid transparent; }
    .nav a:hover, .nav a.active { color: var(--accent-cyan); background: rgba(0, 210, 255, 0.08); border-color: rgba(0, 210, 255, 0.3); text-shadow: 0 0 8px rgba(0, 210, 255, 0.5); }
    .nav-user { font-size: 13px; color: var(--text-muted); }
    .logout { background: transparent; border: 1px solid var(--accent-red); color: var(--accent-red); padding: 5px 12px; border-radius: 4px; cursor: pointer; margin-left: 10px; }
    .container { max-width: 1400px; width: 90%; margin: 30px auto; flex-grow: 1; }
    .page-heading { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
    .page-heading h1 { margin: 0; font-size: 28px; font-weight: 700; }
    .form-actions { display: flex; gap: 12px; }
    .btn { background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple)); border: none; color: #fff; padding: 10px 20px; font-weight: 600; border-radius: 6px; cursor: pointer; box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3); }
    .reports-charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; margin-bottom: 30px; }
    .panel { background: var(--panel-bg); border: 1px solid var(--border-cyber); border-radius: 12px; padding: 25px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4); backdrop-filter: blur(8px); }
    .panel h3 { margin-top: 0; margin-bottom: 20px; font-size: 15px; text-transform: uppercase; color: var(--accent-cyan); }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
    th { color: var(--text-muted); font-weight: 600; padding: 12px 10px; border-bottom: 1px solid rgba(255,255,255,0.08); }
    td { padding: 14px 10px; border-bottom: 1px solid rgba(255,255,255,0.05); color: var(--text-main); }
    @media print {
      body { background: #fff; color: #000; background-image: none; }
      .topbar, .form-actions, .btn { display: none !important; }
      .panel { border: 1px solid #ccc; background: #fff; color: #000; box-shadow: none; }
    }
  </style>
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <div class="top-brand">KIAMBU <span>INTERNET SOLUTIONS</span></div>
    <nav class="nav">
      <a class="" href="dashboard.html">Dashboard</a>
      <a class="" href="devices.html">Device Management</a>
      <a class="" href="traffic-log.html">Traffic Logs</a>
      <a class="active" href="reports.html">Reports</a>
    </nav>
    <div class="nav-user"> <span data-username>User</span> <button class="logout" onclick="logoutUser()">Logout</button></div>
  </header>

  <main class="container">
    <div class="page-heading">
      <div>
        <h1>Reports & Exports</h1>
        <p>Generate a summary of device status and recorded traffic activity.</p>
      </div>
      <div class="form-actions">
        <button class="btn" onclick="exportTrafficCSVLocal()">↓ Export traffic CSV</button>
        <button class="btn" onclick="printReportLocal()">Print / Save PDF</button>
      </div>
    </div>
    
    <div class="reports-charts-row">
      <div class="panel">
        <h3>📊 Protocol Distribution</h3>
        <div style="height: 200px; position: relative; display: flex; justify-content: center;"><canvas id="protocolChart"></canvas></div>
      </div>
      <div class="panel">
        <h3>⚡ Top Bandwidth Consumers</h3>
        <div style="height: 200px; position: relative;"><canvas id="consumersChart"></canvas></div>
      </div>
    </div>

    <div class="panel">
      <h3>Recent traffic records</h3>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Timestamp</th><th>Device</th><th>Traffic in</th><th>Traffic out</th><th>Status</th></tr>
          </thead>
          <tbody id="report-rows"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script>
  const reportRecords = [
    { time: "2026-11-10 20:30:11", name: "Core WAN Gateway", in: "45210400", out: "125400210", status: "Success" },
    { time: "2026-11-10 20:29:45", name: "Main HQ Switch", in: "12450110", out: "8450200", status: "Success" },
    { time: "2026-11-10 20:28:14", name: "Data Server 01", in: "845100560", out: "1940210440", status: "Success" }
  ];

  document.addEventListener("DOMContentLoaded", function () {
    document.getElementById("report-rows").innerHTML = reportRecords.map(r => `
      <tr><td>${r.time}</td><td><strong>${r.name}</strong></td><td>${r.in} bytes</td><td>${r.out} bytes</td><td>${r.status}</td></tr>
    `).join('');

    new Chart(document.getElementById('protocolChart').getContext('2d'), {
      type: 'doughnut', data: { labels: ['HTTPS', 'SNMP', 'TCP', 'UDP'], datasets: [{ data:, backgroundColor: ['#00d2ff', '#9d4edd', '#39ff14', '#ff3333'], borderWidth: 0 }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { color: '#8a99ad' } } }, cutout: '70%' }
    });

    new Chart(document.getElementById('consumersChart').getContext('2d'), {
      type: 'bar', data: { labels: ['Core Router', 'Server 01', 'HQ Switch', 'Office AP'], datasets: [{ data:, backgroundColor: 'rgba(0, 210, 255, 0.75)' }] },
      options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { grid: { color: 'rgba(255,255,255,0.03)' } }, y: { grid: { display: false } } } }
    });
  });

  function exportTrafficCSVLocal() {
    let csvContent = "data:text/csv;charset=utf-8,Timestamp,Device,Traffic In,Traffic Out,Status\n";
    reportRecords.forEach(r => { csvContent += `${r.time},${r.name},${r.in},${r.out},${r.status}\n`; });
    const encodedUri = encodeURI(csvContent);
    const link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    link.setAttribute("download", "network_traffic_report.csv");
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  function printReportLocal() { window.print(); }
  function logoutUser() { localStorage.removeItem("authToken"); window.location.href = "index.html"; }
</script>
</body>
</html>

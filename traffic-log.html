<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Traffic Logs | Kiambu Internet Solutions</title>
  <style>
    :root {
      --bg-dark: #0a0e17;
      --panel-bg: rgba(16, 24, 40, 0.75);
      --accent-cyan: #00d2ff;
      --accent-purple: #9d4edd;
      --accent-green: #39ff14;
      --accent-red: #ff3333;
      --text-main: #f0f4f8;
      --text-muted: #8a99ad;
      --border-cyber: rgba(0, 210, 255, 0.15);
      --input-bg: rgba(10, 14, 23, 0.6);
      --terminal-font: 'Courier New', Courier, monospace;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(0, 210, 255, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(157, 78, 221, 0.12) 0px, transparent 50%),
        linear-gradient(rgba(18, 18, 18, 0.4) 1px, transparent 1px),
        linear-gradient(90deg, rgba(18, 18, 18, 0.4) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      color: var(--text-main);
    }

    .app-shell {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(10, 14, 23, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-cyber);
      padding: 15px 40px;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
    }

    .top-brand {
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--text-main);
      font-size: 18px;
    }

    .top-brand span {
      color: var(--accent-cyan);
      font-weight: 300;
    }

    .nav {
      display: flex;
      gap: 10px;
    }

    .nav a {
      color: var(--text-muted);
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.3s ease;
      border: 1px solid transparent;
    }

    .nav a:hover, .nav a.active {
      color: var(--accent-cyan);
      background: rgba(0, 210, 255, 0.08);
      border-color: rgba(0, 210, 255, 0.3);
      text-shadow: 0 0 8px rgba(0, 210, 255, 0.5);
    }

    .logout {
      background: transparent;
      border: 1px solid var(--accent-red);
      color: var(--accent-red);
      padding: 5px 12px;
      border-radius: 4px;
      cursor: pointer;
      margin-left: 10px;
      transition: all 0.3s;
    }

    .logout:hover {
      background: rgba(255, 51, 51, 0.15);
      box-shadow: 0 0 10px rgba(255, 51, 51, 0.3);
    }

    .container {
      max-width: 1400px;
      width: 90%;
      margin: 30px auto;
      flex-grow: 1;
    }

    .page-heading {
      margin-bottom: 25px;
    }

    .page-heading h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
    }

    .page-heading p {
      margin: 5px 0 0 0;
      color: var(--text-muted);
      font-size: 14px;
    }

    .panel {
      background: var(--panel-bg);
      border: 1px solid var(--border-cyber);
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
    }

    .toolbar {
      margin-bottom: 20px;
      display: flex;
      width: 100%;
    }

    #log-search {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid rgba(0, 210, 255, 0.25);
      border-radius: 6px;
      padding: 14px 16px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: all 0.3s;
    }

    #log-search:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 12px rgba(0, 210, 255, 0.25);
    }

    .table-wrap {
      overflow-x: auto;
      border-radius: 6px;
      background: rgba(10, 14, 23, 0.4);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      color: var(--text-muted);
      font-weight: 600;
      padding: 14px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    td {
      padding: 14px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      color: var(--text-main);
      font-size: 13px;
    }

    td:nth-child(1), td:nth-child(3), td:nth-child(4) {
      font-family: var(--terminal-font);
    }

    tr:hover td {
      background: rgba(0, 210, 255, 0.03);
    }
  </style>
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <div class="top-brand">KIAMBU <span>INTERNET SOLUTIONS</span></div>
    <nav class="nav">
      <a class="" href="dashboard.html">Dashboard</a>
      <a class="" href="devices.html">Device Management</a>
      <a class="active" href="traffic-log.html">Traffic Logs</a>
      <a class="" href="reports.html">Reports</a>
    </nav>
    <div class="nav-user">User <button class="logout" onclick="logoutUser()">Logout</button></div>
  </header>

  <main class="container">
    <div class="page-heading">
      <h1>Traffic Logs</h1>
      <p>Search and review recorded traffic activity by device, time and status.</p>
    </div>
    
    <div class="panel">
      <div class="toolbar">
        <input id="log-search" type="search" placeholder="Search device, timestamp or status..." oninput="searchLogsEngine()">
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Timestamp</th><th>Device</th><th>Traffic in (bytes)</th><th>Traffic out (bytes)</th><th>Status</th></tr>
          </thead>
          <tbody id="log-rows"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script>
  const logData = [
    { time: "2026-11-10 23:44:11", name: "Core WAN Gateway", in: "45,210,400", out: "125,400,210", status: "Success" },
    { time: "2026-11-10 23:42:45", name: "Main HQ Switch", in: "12,450,110", out: "8,450,200", status: "Success" },
    { time: "2026-11-10 23:39:14", name: "Data Server 01", in: "845,100,560", out: "1,940,210,440", status: "Success" },
    { time: "2026-11-10 23:15:02", name: "Remote Office AP", in: "0", out: "0", status: "Timeout Failure" }
  ];

  function displayLogs(items) {
    document.getElementById("log-rows").innerHTML = items.map(l => `
      <tr>
        <td>${l.time}</td>
        <td><strong>${l.name}</strong></td>
        <td>${l.in}</td>
        <td>${l.out}</td>
        <td style="color:${l.status === 'Success' ? '#39ff14' : '#ff3333'}">${l.status}</td>
      </tr>
    `).join('');
  }

  function searchLogsEngine() {
    const val = document.getElementById("log-search").value.toLowerCase();
    const filtered = logData.filter(l => 
      l.name.toLowerCase().includes(val) || 
      l.time.includes(val) || 
      l.status.toLowerCase().includes(val)
    );
    displayLogs(filtered);
  }

  document.addEventListener("DOMContentLoaded", () => displayLogs(logData));
  
  function logoutUser() { 
    localStorage.clear(); 
    window.location.href = "index.html"; 
  }
</script>
</body>
</html>
